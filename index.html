<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>5 APPS.SHOP</title>
    <style>
        body {
            background-color: #121212;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }

        .app-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding: 20px;
        }

        .app-card {
            background-color: #1E1E1E;
            padding: 15px;
            border-radius: 10px;
            width: 200px;
            text-align: center;
        }

        .app-card img {
            width: 100px;
            height: 100px;
            border-radius: 10px;
        }

        .install-btn {
            background-color: #22c55e;
            color: white;
            padding: 10px;
            border-radius: 5px;
            text-decoration: none;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>5 APPS.SHOP</h1>
    <input type="text" placeholder="APP OR GAME NAME"/>

    <div class="app-container">
        <div class="app-card">
            <img src="https://github.com/FireTvAmz/Games/blob/main/005.png?raw=true" alt="GTA 5"/>
            <h3>GTA 5</h3>
            <p>Platforms: 🖥📱</p>
            <a href="#" class="install-btn">install</a>
        </div>

            <p>Platforms: 🖥📱</p>

            <h3>MINECRAFT</h3>
            <p>Platforms: 🖥📱</p>

            <h3>POPPY PLAYTIME</h3>

            <h3>FIFA 22</h3>
            <p>Platforms: 🖥📱</p>
